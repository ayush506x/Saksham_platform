<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Study &amp; Competency Hub — Saksham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="trainee-ai-hub.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebar"></aside>
  <div class="app-main">
    <div class="app-topbar" id="topbar"></div>
    <div class="app-content">

      <div class="card card-pad" style="background:var(--navy-800);border:none;margin-bottom:22px;">
        <h2 style="color:#fff;font-size:19px;margin:0 0 6px 0;">AI Learning &amp; Mentorship Desk ⚡</h2>
        <p style="color:#C9D6E7;margin:0;">Generate instant assessment quizzes from your lecture notes, or find the highest-rated national trainers for your course topic.</p>
      </div>

      <!-- INCLUDED TRAINEE AI HUB COMPONENT -->
      <div id="aiHubMount">
        <!-- Rendered component here -->
      </div>

    </div>
  </div>
</div>

<script src="../assets/js/clerk-auth.js"></script>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="trainee-ai-hub.js"></script>
<script>
  if (typeof initDashboardShell === "function") {
    initDashboardShell({ role: "trainee", active: "ai-hub.html", title: "AI Study & Competency Hub", crumb: "Trainee workspace" });
  }

  // Load component
  fetch('trainee-ai-hub.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('aiHubMount').innerHTML = html;
      if (window.SakshamAIHub) {
        window.SakshamAIHub.loadNotesPreset('cyclone');
        window.SakshamAIHub.findTrainers();
      }
    })
    .catch(e => console.error("Error mounting AI Hub:", e));
</script>
</body>
</html>
