<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Saksham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header"><div class="container">
  <a href="index.html" class="brand" style="text-decoration:none;">
    <div class="brand-emblem">
      <img src="assets/images/saksham-bharat-logo.png" alt="Saksham Bharat Logo" class="brand-logo-img">
    </div>
    <div class="brand-text"><div class="brand-name">Saksham Bharat</div><div class="brand-sub">National Training &amp; Competency Platform</div></div>
  </a>
  <a href="index.html" class="btn btn-ghost btn-sm">← Back to home</a>
</div></header>
<div class="tricolor-rule"></div>

<div class="auth-shell">
  <div class="auth-card" style="max-width:440px;">
    <h1>Welcome back</h1>
    <p class="sub">Log in to continue your training journey.</p>
    <div id="statusBox"></div>
    <div id="clerk-signin"></div>

    <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:18px;">
      <p style="font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;text-align:center;text-transform:uppercase;letter-spacing:.6px;">
        1-Click Demo Logins
      </p>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button type="button" class="btn btn-outline btn-sm btn-block" style="justify-content:flex-start;display:flex;align-items:center;" onclick="quickLogin('trainee')">
          <span>🎓 <strong>Log in as Trainee</strong></span>
          <span style="font-size:11px;color:var(--ink-soft);margin-left:auto;">Aditi Sharma (Finance)</span>
        </button>
        <button type="button" class="btn btn-outline btn-sm btn-block" style="justify-content:flex-start;display:flex;align-items:center;" onclick="quickLogin('trainer')">
          <span>👨‍🏫 <strong>Log in as Trainer</strong></span>
          <span style="font-size:11px;color:var(--ink-soft);margin-left:auto;">R. Mehta (Governance)</span>
        </button>
        <button type="button" class="btn btn-outline btn-sm btn-block" style="justify-content:flex-start;display:flex;align-items:center;" onclick="quickLogin('admin')">
          <span>⚙️ <strong>Log in as Admin</strong></span>
          <span style="font-size:11px;color:var(--ink-soft);margin-left:auto;">CBC Verification Desk</span>
        </button>
      </div>
    </div>

    <p class="auth-foot">New here? <a href="signup.html">Create an account</a></p>
  </div>
</div>

<script src="assets/js/clerk-auth.js"></script>
<script src="assets/js/api.js"></script>
<script>
  const routes = {
    trainee: "trainee/profile.html",
    trainer: "trainer/dashboard.html",
    admin: "admin/dashboard.html"
  };
  const statusBox = document.getElementById("statusBox");

  window.quickLogin = function(role) {
    const demoProfiles = {
      trainee: { name: "Aditi Sharma", email: "aditi.sharma@gov.in", role: "trainee", dept: "Finance", status: "APPROVED", designation: "Section Officer" },
      trainer: { name: "R. Mehta", email: "r.mehta@gov.in", role: "trainer", dept: "Governance", status: "APPROVED", designation: "Senior Trainer" },
      admin: { name: "Administrator", email: "admin@saksham.gov.in", role: "admin", dept: "Capacity Building Commission", status: "APPROVED", designation: "Director" }
    };
    const p = demoProfiles[role] || demoProfiles.trainee;
    localStorage.setItem("saksham_active_user", JSON.stringify(p));
    statusBox.innerHTML = `<div class="alert alert-info">Logging in as ${p.name}…</div>`;
    setTimeout(() => {
      window.location.href = routes[role] || routes.trainee;
    }, 400);
  };

  async function redirectSignedInUser() {
    statusBox.innerHTML = `<div class="alert alert-info">Signing you in…</div>`;
    const clerkUser = window.Clerk && window.Clerk.user;
    const userName = (clerkUser && (clerkUser.fullName || clerkUser.username)) || "User";
    const userEmail = (clerkUser && clerkUser.primaryEmailAddress?.emailAddress) || "";

    let targetRole = "trainee";
    try {
      const profile = await Api.getProfile();
      if (profile && profile.role) targetRole = profile.role;
    } catch (e) {
      try {
        await Api.syncUser({
          name: userName,
          email: userEmail,
          role: "trainee"
        });
      } catch (e2) {
        // Backend not reachable, continue with active role
      }
    }

    const activeUser = {
      name: userName,
      email: userEmail,
      role: targetRole,
      status: "APPROVED",
      provider: "clerk"
    };
    localStorage.setItem("saksham_active_user", JSON.stringify(activeUser));

    const dest = routes[targetRole] || routes.trainee;
    window.location.href = dest;
  }

  (async function () {
    const redirectTarget = window.location.origin + "/trainee/profile.html";
    await AuthGuard.mountSignIn(document.getElementById("clerk-signin"), {
      afterSignInUrl: redirectTarget,
      fallbackRedirectUrl: redirectTarget,
      forceRedirectUrl: redirectTarget,
      signUpUrl: "signup.html"
    });
    if (window.Clerk && window.Clerk.user) redirectSignedInUser();
    AuthGuard.addListener(({ user }) => { if (user) redirectSignedInUser(); });
  })().catch((err) => {
    console.warn("Clerk sign-in widget notice:", err);
    statusBox.innerHTML = `<div class="alert alert-info" style="font-size:13px;">Clerk authentication is connecting. You can also use the <strong>1-Click Demo Login</strong> buttons below to immediately enter your role workspace.</div>`;
  });
</script>
</body>
</html>
