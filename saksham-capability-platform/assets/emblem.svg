<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="48" height="58">
  <!-- Stylized Ashoka Lion Capital / Emblem Silhouette for Gov Portal -->
  <g fill="#0b2545">
    <!-- Base Pedestal -->
    <rect x="20" y="98" width="60" height="6" rx="2"/>
    <rect x="15" y="105" width="70" height="4" rx="1"/>
    
    <!-- Central Ashoka Chakra in Base -->
    <circle cx="50" cy="85" r="9" fill="none" stroke="#0b2545" stroke-width="1.8"/>
    <circle cx="50" cy="85" r="2.5" fill="#0b2545"/>
    <!-- 24 Spokes representation -->
    <path d="M50 76 L50 94 M41 85 L59 85 M43.6 78.6 L56.4 91.4 M43.6 91.4 L56.4 78.6 M46.2 76.5 L53.8 93.5 M46.2 93.5 L53.8 76.5 M41.5 81.2 L58.5 88.8 M41.5 88.8 L58.5 81.2" stroke="#0b2545" stroke-width="0.8"/>
    
    <!-- Supporting animals silhouettes left and right (Bull and Horse stylized) -->
    <path d="M23 88 Q28 84 35 87 Q33 90 25 91 Z" fill="#0b2545"/>
    <path d="M77 88 Q72 84 65 87 Q67 90 75 91 Z" fill="#0b2545"/>

    <!-- Central Lion Head -->
    <path d="M42 28 Q50 20 58 28 Q63 36 61 46 Q58 56 50 68 Q42 56 39 46 Q37 36 42 28 Z"/>
    <path d="M46 32 Q50 30 54 32 Q50 36 46 32 Z" fill="#ffffff"/>
    <circle cx="47" cy="40" r="1.5" fill="#ffffff"/>
    <circle cx="53" cy="40" r="1.5" fill="#ffffff"/>
    <!-- Mane details -->
    <path d="M38 45 Q32 50 38 56 Q40 60 48 70 Q52 70 62 56 Q68 50 62 45" fill="none" stroke="#0b2545" stroke-width="2"/>

    <!-- Left Lion Profile -->
    <path d="M38 32 Q30 26 25 34 Q20 44 26 52 Q32 58 39 64 Q36 50 38 32 Z"/>
    <circle cx="28" cy="40" r="1.2" fill="#ffffff"/>

    <!-- Right Lion Profile -->
    <path d="M62 32 Q70 26 75 34 Q80 44 74 52 Q68 58 61 64 Q64 50 62 32 Z"/>
    <circle cx="72" cy="40" r="1.2" fill="#ffffff"/>
    
    <!-- Crown / Lotus base -->
    <path d="M30 72 Q50 78 70 72 Q65 76 50 77 Q35 76 30 72 Z"/>
  </g>
  <text x="50" y="117" font-family="'Noto Sans', 'Segoe UI', Arial" font-size="7.5" font-weight="bold" fill="#0b2545" text-anchor="middle" letter-spacing="1">सत्यमेव जयते</text>
</svg>
